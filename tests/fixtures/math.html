<!doctype html>
<html lang="vi">

<title>CVAT QA/QC — Browser math tests</title>
<style>
body { margin: 24px; background: #111214; color: #f5f5f7; font: 13px system-ui; }
pre { padding: 16px; border: 1px solid #343438; border-radius: 8px; background: #1c1c1e; white-space: pre-wrap; }
</style>
<h1>Browser math tests</h1>
<pre id="output">Đang chạy…</pre>
<script>
const output = document.querySelector('#output');
const lines = [];
for (const method of ['log', 'warn', 'error']) {
    const original = console[method].bind(console);
    console[method] = (...args) => {
        original(...args);
        lines.push(args.map(String).join(' '));
        output.textContent = lines.join('\n');
    };
}
</script>
